# Portable CPU mode. Supply/draw boxes; UPN requires the optional NVIDIA image.
# NVIDIA: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  vlm-fo1:
    build:
      context: .
      target: cpu
    image: vlm-fo1:cpu
    ports:
      - "127.0.0.1:${VLM_FO1_PORT:-8000}:8000"
    environment:
      VLM_FO1_MODEL: ${VLM_FO1_MODEL:-omlab/VLM-FO1_Qwen2.5-VL-3B-v01}
      VLM_FO1_LLM_MODEL: ${VLM_FO1_LLM_MODEL:-Qwen/Qwen3.5-0.8B}
      VLM_FO1_DEVICE: cpu
      VLM_FO1_ATTN_IMPL: ${VLM_FO1_ATTN_IMPL:-sdpa}
      UPN_CKPT: /app/resources/upn_large.pth
      UPN_AUTO_DOWNLOAD: ${UPN_AUTO_DOWNLOAD:-0}
      # Forward the token only if it exists in the host environment.
      HF_TOKEN:
    volumes:
      - ./resources:/app/resources
      - ./outputs:/app/outputs
      - hf-cache:/root/.cache/huggingface
    shm_size: "2gb"
    init: true

volumes:
  hf-cache:
